name: Publish Family Dinner Website
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "recipes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "github-pages"
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          python3 -m json.tool data/dinners.json > /dev/null
          mkdir -p _site/data
          cp -a site/. _site/
          cp data/dinners.json _site/data/dinners.json
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
